<html>
<head>
  <title>Dashboard - OZZIEKOST</title>
  <style>
    body { font-family: Arial; background: #f0f4f8; margin: 0; }
    .header { background: #2563eb; color: white; padding: 20px; text-align: center; }
    .container { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card h2 { color: #2563eb; font-size: 32px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>OZZIEKOST Dashboard</h1>
    <a href="index.html" style="color:white">← Back to Home</a>
  </div>
  
  <div class="container">
    <div class="card">
      <p>Total Penyewa</p>
      <h2 id+"totalPenyewa">12</h2>
    </div>
    <div class="card">
      <p>Kamar Kosong</p>
      <h2 id="kamarKosong">3</h2>
    </div>
    <div class="card">
      <p>Pembayaran Bulan Ini</p>
      <h2 id="totalBayar">Rp 8.500.000</h2>
    </div>
  </div>
 <script>
async function loadData() {
  // 1. Replace these 3 with your published CSV links from Google Sheets
  const penyewaURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQULjPlDZDxI2SeaMEqiTdIh3cQJqqLEz3m92pB4UGvX0baS70kqv5QGckp8hazPwkCIb8rOQOX57qL/pub?gid=0&single=true&output=csv";
  const kamarURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQULjPlDZDxI2SeaMEqiTdIh3cQJqqLEz3m92pB4UGvX0baS70kqv5QGckp8hazPwkCIb8rOQOX57qL/pub?gid=1077475339&single=true&output=csv"; 
  const bayarURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQULjPlDZDxI2SeaMEqiTdIh3cQJqqLEz3m92pB4UGvX0baS70kqv5QGckp8hazPwkCIb8rOQOX57qL/pub?gid=1845020076&single=true&output=csv";

  // 2. Load Total Penyewa
  const penyewaData = await fetch(penyewaURL).then(r => r.text());
  const totalPenyewa = penyewaData.split('\n').length - 1; // -1 for header
  document.getElementById('totalPenyewa').innerText = totalPenyewa;

  // 3. Load Kamar Kosong - example: count rows where Status = Kosong
  const kamarData = await fetch(kamarURL).then(r => r.text());
  const kamarKosong = kamarData.split('\n').filter(row => row.includes('Kosong')).length;
  document.getElementById('kamarKosong').innerText = kamarKosong;

  // 4. Load Pembayaran - example: sum column
  const bayarData = await fetch(bayarURL).then(r => r.text());
  // You'd need to sum the column here. For now we just show 1
  document.getElementById('totalBayar').innerText = "Rp ...";
}
loadData();
</script> 
</body>
</html>
